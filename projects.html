title: Projects
---

<div>
    <h2>Projects</h2>
    <p>Those are all the projects I worked on in my free time.</p>
</div>
<div>
    {% for project in site.projects %} {% if project.tag != "no_main_show" %}
    <h3>
        <a href="{{ project.url }}" class="simple-link">{{ project.title }}</a>
    </h3>
    <div class="muted">{{ project.excerpt }}</div>
    {% endif %} {% endfor %}
</div>
